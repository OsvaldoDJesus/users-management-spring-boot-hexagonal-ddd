# =============================================
# Test configuration (fictitious values only)
# =============================================

# Evita levantar contexto web en tests Mockito puros (@ExtendWith(MockitoExtension.class))
spring.main.web-application-type=none
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

db.host=localhost
db.port=3306
db.name=test_db
db.username=test_user
db.password=test_pass

# =============================================
# Brevo test configuration
# =============================================
brevo.base-url=http://localhost
brevo.api-key=xkeysib-test-api-key
brevo.from.address=test@test.local
brevo.from.name=Test User
brevo.timeout.connect=100ms
brevo.timeout.read=100ms
brevo.retry.max-attempts=1
brevo.retry.initial-delay=1ms
brevo.retry.multiplier=2.0
brevo.circuit-breaker.failure-rate-threshold=50
brevo.circuit-breaker.sliding-window-size=10
brevo.circuit-breaker.minimum-calls=5
brevo.circuit-breaker.open-duration=1s

jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtd2l0aC1hdC1sZWFzdC0zMi1ieXRlcw==
jwt.expiration-seconds=900
